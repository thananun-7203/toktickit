name: CI

on:
  workflow_dispatch:
  push:
    branches: [lab2-staging, lab3-staging, "lab2-*", main]
  pull_request:
    branches: [lab2-staging, lab3-staging, main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toktickit
          POSTGRES_PASSWORD: toktickit
          POSTGRES_DB: toktickit_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://toktickit:toktickit@localhost:5432/toktickit_ci_test?schema=public

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Seed database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: npx prisma validate

      - name: Audit production server dependencies
        run: npm audit --omit=dev

      - name: Run server tests
        run: npm test

      - name: Build server
        run: npm run build

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run client tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Audit production client dependencies
        run: npm audit --omit=dev

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]

    env:
      E2E_DATABASE_URL: postgresql://toktickit:toktickit@127.0.0.1:5433/toktickit_lab3_e2e?schema=public
      SEAWEEDFS_FILER_URL: http://127.0.0.1:8888

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start PostgreSQL and SeaweedFS
        run: docker compose -f compose.lab2.yml up -d --wait

      - name: Wait for SeaweedFS filer
        run: curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://127.0.0.1:8888/

      - name: Create dedicated Lab 3 E2E database
        run: docker compose -f compose.lab2.yml exec -T postgres createdb -U toktickit toktickit_lab3_e2e

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Apply E2E migrations
        working-directory: server
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Seed E2E database
        working-directory: server
        env:
          DATABASE_URL: ${{ env.E2E_DATABASE_URL }}
        run: npx prisma db seed

      - name: Run Lab 3 E2E
        working-directory: e2e
        run: npm test

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab3-e2e-artifacts
          path: artifacts/lab-03/
          if-no-files-found: ignore

      - name: Stop E2E services
        if: always()
        run: docker compose -f compose.lab2.yml down
